name: Update Noto Color Emoji CBDT

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check and update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/googlefonts/noto-emoji/releases/latest)

          TAG=$(echo "$RELEASE" | jq -r .tag_name)
          VERSION="${TAG#v}"

          CASK_FILE=Casks/font-noto-color-emoji-cbdt.rb
          CURRENT_VERSION=$(grep -oP 'version "\K[^"]+' "$CASK_FILE" | head -1)

          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Already at version ${VERSION}, skipping"
            exit 0
          fi

          echo "Updating from ${CURRENT_VERSION} to ${VERSION}"

          SHA256=$(curl -fsSL \
            "https://github.com/googlefonts/noto-emoji/raw/v${TAG}/fonts/NotoColorEmoji.ttf" \
            | sha256sum | cut -d' ' -f1)

          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK_FILE"
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "$CASK_FILE"
          echo "Updated ${CASK_FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          git diff --cached --quiet || git commit -m "chore: update Noto Color Emoji CBDT to ${TAG}"
          git push