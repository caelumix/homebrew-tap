name: Update Yuniversus Font

on:
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check and update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/forfudan/yuhao-ime-release/releases/latest)

          TAG=$(echo "$RELEASE" | jq -r .tag_name)
          VERSION="${TAG#v}"

          CURRENT_VERSION=$(grep -oP 'version "\K[^"]+' Casks/font-yuniversus.rb | head -1)

          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "Already at version ${VERSION}, skipping"
            exit 0
          fi

          echo "Updating from ${CURRENT_VERSION} to ${VERSION}"

          ASSETS=$(echo "$RELEASE" | jq -r '.assets[] | "\(.name)|\(.digest)"')
          ASSET_NAME="riyue_lingming_${TAG}.zip"
          DIGEST=$(echo "$ASSETS" | grep "^${ASSET_NAME}|" | cut -d'|' -f2)
          SHA256="${DIGEST#sha256:}"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/font-yuniversus.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/font-yuniversus.rb
          echo "Updated Casks/font-yuniversus.rb"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/font-yuniversus.rb
          git diff --cached --quiet || git commit -m "chore: update Yuniversus to ${TAG}"
          git push
